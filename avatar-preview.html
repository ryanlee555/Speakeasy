<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speakeasy avatar icons</title>
<style>
  body{margin:0;padding:32px;background:#14100E;color:#F2E4D4;
    font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:26px;margin:0 0 6px}
  p.sub{color:#9A8B7E;font-size:14px;margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;max-width:920px}
  .cell{margin:0;text-align:center}

  .cell:hover .tile{border-color:#C87941}
  figcaption{margin-top:7px;font-size:12px;color:#C9B8A8;line-height:1.5}
  figcaption span{display:block;color:#7C6E63;font-size:11px;font-family:ui-monospace,monospace}
</style></head><body>
<h1>Avatar icons</h1>
<p class="sub">30 icons. The label under each one is the id you store on the user record.</p>
